name: Secret expiry check

# Sprint 6 — closes the gap README.md §10 flagged: nothing used to watch GHCR_PAT's hard
# expiry date (or nudge a routine review of the password/JWT secrets that don't expire but
# should still get rotated periodically) until a human happened to remember. This runs on a
# schedule so it fires even on days nobody pushes anything, plus workflow_dispatch for an
# on-demand check and a push trigger on the inventory file itself so a typo'd date shows red
# immediately instead of silently doing nothing for months.
#
# Source of truth: .github/secrets-inventory.json. Update the relevant entry every time a
# secret is actually rotated — this workflow only ever reads that file, it has no access to
# the real secret values and doesn't need any (this is a calendar check, not a rotation).
on:
  schedule:
    - cron: "0 8 * * *" # daily, 08:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/secrets-inventory.json"
      - ".github/workflows/secret-expiry-check.yml"

jobs:
  check:
    name: Check secret expiry / review dates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate secrets-inventory.json
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          today_epoch=$(date -u -d "$today" +%s)
          failed=0

          count=$(jq '.secrets | length' .github/secrets-inventory.json)
          for i in $(seq 0 $((count - 1))); do
            entry=$(jq -c ".secrets[$i]" .github/secrets-inventory.json)
            name=$(echo "$entry" | jq -r '.name')
            kind=$(echo "$entry" | jq -r '.kind')
            doc=$(echo "$entry" | jq -r '.rotation_doc')

            if [ "$kind" = "hard_expiry" ]; then
              expires_on=$(echo "$entry" | jq -r '.expires_on')
              warn_days=$(echo "$entry" | jq -r '.warn_days_before')
              expires_epoch=$(date -u -d "$expires_on" +%s)
              days_left=$(( (expires_epoch - today_epoch) / 86400 ))

              if [ "$days_left" -lt 0 ]; then
                echo "::error::$name expired $(( -days_left )) day(s) ago ($expires_on). Rotate it now — see $doc."
                failed=1
              elif [ "$days_left" -le "$warn_days" ]; then
                echo "::error::$name expires in $days_left day(s) ($expires_on, threshold ${warn_days}d). Rotate it — see $doc."
                failed=1
              else
                echo "OK: $name expires in $days_left day(s) ($expires_on) — outside the ${warn_days}d warning window."
              fi

            elif [ "$kind" = "routine_review" ]; then
              last_rotated=$(echo "$entry" | jq -r '.last_rotated')
              interval=$(echo "$entry" | jq -r '.review_interval_days')

              if ! date -u -d "$last_rotated" >/dev/null 2>&1; then
                echo "::error::$name has no valid last_rotated date in secrets-inventory.json (currently \"$last_rotated\"). Fill in the real date it was last changed — see $doc."
                failed=1
                continue
              fi

              last_epoch=$(date -u -d "$last_rotated" +%s)
              days_since=$(( (today_epoch - last_epoch) / 86400 ))

              if [ "$days_since" -ge "$interval" ]; then
                echo "::error::$name was last rotated $days_since day(s) ago (>= ${interval}d review interval). Time for a routine rotation — see $doc."
                failed=1
              else
                echo "OK: $name last rotated $days_since day(s) ago (review interval ${interval}d)."
              fi

            else
              echo "::error::$name has unknown kind \"$kind\" in secrets-inventory.json (expected hard_expiry or routine_review)."
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "One or more secrets need attention — see the errors above."
            exit 1
          fi
