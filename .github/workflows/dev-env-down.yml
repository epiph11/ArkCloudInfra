name: Dev env — arrêt à la demande

# Sprint 6 clôture (12/09) — cet environnement dev n'a aucun utilisateur réel et un rythme de
# travail sporadique (pas de créneau régulier) : plutôt qu'un planning nuit/weekend qui suppose
# des horaires fixes, deux workflows manuels (celui-ci + dev-env-up.yml) à déclencher soi-même
# juste avant/après une session de dev ou de test.
#
# CORRECTIF 03/10/2026 — la version initiale ne couvrait QUE Azure ; AWS tournait 24/7 (NAT Gateway,
# ALB, Fargate, RDS ≈ 100 $/mois, facture réelle ~150 €). Ce workflow coupe maintenant AUSSI AWS :
#   - NAT Gateway + EIP (~33 $/mois, jamais Free Tier), ALB (~18 $/mois + IPv4 publiques) et les
#     2 services Fargate sont DÉTRUITS (terraform destroy -target, cascade vers les alarmes /
#     la rotation de secret qui en dépendent — tout est recréé par dev-env-up.yml) ;
#   - RDS est ARRÊTÉ (aws rds stop-db-instance) : plus de facturation du compute, stockage seul.
# Piège connu : RDS ET PostgreSQL Flexible Server Azure REDÉMARRENT AUTOMATIQUEMENT après 7 jours
# d'arrêt. dev-env-keep-stopped.yml (planifié) les re-stoppe tant que l'environnement est éteint.
#
# Ce que ça arrête réellement, et pourquoi c'est ce qui compte le plus côté coût :
#   - Le Plan App Service partagé (asp-arkcloud-dev, ~12€/mois s'il tourne 24/7) — Azure facture
#     un Plan à l'heure d'EXISTENCE, pas d'usage, donc `az webapp stop` seul ne changerait rien à
#     la facture. Il faut le détruire pour de vrai (terraform destroy -target), pas juste
#     arrêter les apps dessus.
#   - PostgreSQL Flexible Server (~13€/mois s'il tourne 24/7) — lui, `stop` suffit : Azure ne
#     facture plus le compute une fois arrêté (le stockage continue, ~1-2€/mois, négligeable).
#
# terraform destroy -target sur le Plan cascade automatiquement vers tout ce qui en dépend dans
# le state (les deux azurerm_linux_web_app, leurs diagnostic settings, le role assignment Key
# Vault de l'API) — comportement documenté de Terraform, pas une supposition. dev-env-up.yml
# recrée tout ça d'un coup via un terraform apply normal.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true
  TF_VAR_image_org: ${{ vars.IMAGE_ORG }}
  TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
  TF_VAR_aws_postgres_admin_password: ${{ secrets.AWS_POSTGRES_ADMIN_PASSWORD }}
  TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
  TF_VAR_entra_admin_principal_name: ${{ vars.ENTRA_ADMIN_PRINCIPAL_NAME }}
  TF_VAR_entra_admin_object_id: ${{ vars.ENTRA_ADMIN_OBJECT_ID }}

jobs:
  stop:
    name: Détruire le Plan App Service + arrêter Postgres
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Mêmes zips Lambda gitignorés que terraform-ci.yml — nécessaires même pour un destroy
      # ciblé : Terraform évalue filebase64sha256() sur TOUTE la config avant de calculer quoi
      # que ce soit, y compris les ressources hors du -target.
      - name: Build des packages Lambda (rotation + purge RGPD)
        run: |
          bash "$GITHUB_WORKSPACE/modules/aws/secret-rotation/lambda/build.sh"
          bash "$GITHUB_WORKSPACE/modules/aws/gdpr-purge/lambda/build.sh"

      - name: terraform init
        run: terraform init

      # Un seul destroy (Azure + AWS) pour ne rafraîchir le state qu'une fois.
      - name: terraform destroy — Plan App Service (Azure) + NAT/ALB/ECS (AWS)
        run: |
          terraform destroy -auto-approve -input=false \
            -target=azurerm_service_plan.arkcloud \
            -target=module.app_service_api.azurerm_linux_web_app.this \
            -target=module.app_service_web.azurerm_linux_web_app.this \
            -target=module.aws_ecs_service_api \
            -target=module.aws_ecs_service_web \
            -target=module.aws_alb \
            -target=module.aws_vpc.aws_nat_gateway.this \
            -target=module.aws_vpc.aws_eip.nat

      - name: Azure login (CLI, séparé du provider Terraform)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Arrêter PostgreSQL Flexible Server (Azure)
        run: |
          STATE=$(az postgres flexible-server show --name psql-arkcloud-dev \
            --resource-group rg-arkcloud-dev --query state -o tsv)
          echo "État Postgres Azure : $STATE"
          if [ "$STATE" = "Ready" ]; then
            az postgres flexible-server stop --name psql-arkcloud-dev --resource-group rg-arkcloud-dev
          fi

      - name: Arrêter RDS PostgreSQL (AWS)
        run: |
          STATE=$(aws rds describe-db-instances --db-instance-identifier psql-arkcloud-dev \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "État RDS : $STATE"
          if [ "$STATE" = "available" ]; then
            aws rds stop-db-instance --db-instance-identifier psql-arkcloud-dev
          fi

      # Vérification : le job échoue (rouge) si une ressource facturée tourne encore.
      - name: Vérifier qu'il ne reste aucune ressource facturée active
        run: |
          NAT=$(aws ec2 describe-nat-gateways --filter Name=state,Values=available,pending \
            --query 'length(NatGateways)' --output text)
          ALB=$(aws elbv2 describe-load-balancers --query 'length(LoadBalancers)' --output text)
          TASKS=$(aws ecs list-tasks --cluster arkcloud-dev --query 'length(taskArns)' --output text 2>/dev/null || echo 0)
          PLAN=$(az appservice plan list --resource-group rg-arkcloud-dev --query 'length(@)' -o tsv)
          echo "NAT actifs=$NAT | ALB=$ALB | tâches ECS=$TASKS | Plans App Service=$PLAN"
          if [ "$NAT" != "0" ] || [ "$ALB" != "0" ] || [ "$TASKS" != "0" ] || [ "$PLAN" != "0" ]; then
            echo "::error::Des ressources facturées tournent encore"; exit 1
          fi
