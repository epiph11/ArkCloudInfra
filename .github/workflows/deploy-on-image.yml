name: Deploy on image published

# Déclenché par ArkCloud (arkcloud-backend-ci.yml / arkcloud-frontend-ci.yml) juste après un
# push d'image réussi vers GHCR — voir ArkCloud/.github/workflows/*.yml, étape "Notify
# ArkCloudInfra of new image". Payload attendu :
#   { "app": "api" | "web", "tag": "<image tag>", "environment": "dev" | "staging" | "prod" }

on:
  repository_dispatch:
    types: [image-published]

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true
  TF_VAR_image_org: ${{ vars.IMAGE_ORG }}
  TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
  TF_VAR_aws_postgres_admin_password: ${{ secrets.AWS_POSTGRES_ADMIN_PASSWORD }}
  TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
  # Bug réel trouvé le 13/09/2026 : oubliées ici lors de l'ajout du passwordless Azure Entra ID
  # (Sprint 6 clôture, 12/09) — présentes dans dev-env-up.yml/dev-env-down.yml mais pas ce
  # workflow. Terraform évalue TOUTES les variables déclarées au plan/apply, même sous -target
  # (voir terraform apply ci-dessous), donc leur absence fait échouer n'importe quel déploiement
  # d'image ici ("No value for required variable"), pas seulement un apply touchant réellement
  # le serveur Postgres.
  TF_VAR_entra_admin_principal_name: ${{ vars.ENTRA_ADMIN_PRINCIPAL_NAME }}
  TF_VAR_entra_admin_object_id: ${{ vars.ENTRA_ADMIN_OBJECT_ID }}

jobs:
  deploy:
    name: terraform apply (${{ github.event.client_payload.app }} → ${{ github.event.client_payload.environment }})
    runs-on: ubuntu-latest
    # Même gate manuel que l'apply normal (terraform-ci.yml) — un déploiement automatique
    # d'image reste soumis à approbation, ce n'est pas parce que la source diffère (event vs
    # push) que le contrôle doit sauter.
    environment: production
    # Bug réel trouvé le 12/09 (clôture Sprint 6) : le tag v0.2.0 a déclenché publish-image
    # côté ArkCloud (api ET web) avec TF_ENVIRONMENT=prod, qui a dispatché ici environment=prod
    # — mais environments/prod ne contient que .gitkeep (staging/prod arrivent Sprints 6-10,
    # cf. commentaires plus bas dans ce fichier). Runs #34/#35 : "Error: No configuration
    # files" après approbation manuelle de l'environment production (donc pas rattrapé avant).
    # Seul environments/dev a une vraie config aujourd'hui — on le vérifie AVANT le checkout/
    # working-directory pour échouer proprement (skip visible) plutôt que de laisser Terraform
    # planter sur un dossier vide. Étendre cette condition (ou la retirer) au fur et à mesure
    # que staging/prod sont réellement provisionnés.
    if: github.event.client_payload.environment == 'dev'
    defaults:
      run:
        working-directory: environments/${{ github.event.client_payload.environment }}
    steps:
      - uses: actions/checkout@v4

      # Sprint 5 — needed even though this job's -target never touches an AWS resource:
      # Terraform configures every provider block declared in the config (providers.tf) during
      # init/plan, regardless of -target, so the aws provider still needs valid credentials or
      # this job fails trying to authenticate it. Same OIDC pattern as Azure below.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        run: terraform init

      # -target scope l'apply à UN SEUL app-service — sans ça, un déploiement de l'API à lui
      # seul repasserait web_image_tag à sa valeur par défaut (aucune valeur n'est fournie
      # pour cette variable dans ce run), ce qui redéploierait Blazor avec "latest" sans
      # raison. -target évite complètement ce problème : Terraform ne touche à rien d'autre
      # que la ressource ciblée, quelle que soit la valeur résolue des autres variables.
      #
      # Task #38 — added the AWS ECS -target alongside the existing Azure one: api_image_tag/
      # web_image_tag already drive both clouds (single var, single state file, see
      # environments/dev/main.tf), so no new variable was needed — just a second -target so
      # Terraform actually touches the ECS service too instead of silently ignoring it.
      #
      # Guarded to dev: only environments/dev has an aws_ecs_service_api/web module today
      # (Sprint 5). staging/prod land with Sprints 6-10 — drop the guard once those modules
      # exist there too.
      - name: terraform apply (image tag only)
        run: |
          if [ "${{ github.event.client_payload.app }}" = "api" ]; then
            if [ "${{ github.event.client_payload.environment }}" = "dev" ]; then
              terraform apply -auto-approve -input=false \
                -target=module.app_service_api.azurerm_linux_web_app.this \
                -target=module.aws_ecs_service_api.aws_ecs_service.this \
                -var "api_image_tag=${{ github.event.client_payload.tag }}"
            else
              terraform apply -auto-approve -input=false \
                -target=module.app_service_api.azurerm_linux_web_app.this \
                -var "api_image_tag=${{ github.event.client_payload.tag }}"
            fi
          else
            if [ "${{ github.event.client_payload.environment }}" = "dev" ]; then
              terraform apply -auto-approve -input=false \
                -target=module.app_service_web.azurerm_linux_web_app.this \
                -target=module.aws_ecs_service_web.aws_ecs_service.this \
                -var "web_image_tag=${{ github.event.client_payload.tag }}"
            else
              terraform apply -auto-approve -input=false \
                -target=module.app_service_web.azurerm_linux_web_app.this \
                -var "web_image_tag=${{ github.event.client_payload.tag }}"
            fi
          fi

      # ECS only re-pulls an image when something in the task definition actually changes.
      # dev/staging publish under a floating tag (":dev"/":staging") that's identical run to
      # run, so the terraform apply above can be a true no-op even though a new image just
      # landed in ECR — force-new-deployment makes ECS redeploy the service against whatever
      # the tag currently resolves to, regardless of whether Terraform saw a diff. Harmless
      # to run even when the tag genuinely changed (e.g. a version tag) — it's an idempotent
      # extra rollout, not a duplicate one.
      - name: Force ECS to pull the latest image
        if: github.event.client_payload.environment == 'dev'
        run: |
          aws ecs update-service \
            --cluster arkcloud-arkcloud-dev \
            --service arkcloud-arkcloud-dev-${{ github.event.client_payload.app }} \
            --force-new-deployment \
            --region eu-west-1

      # Bug reel trouve en session (11/09/2026, tache #83 -- ajout de sshd pour Kudu) : cote Azure,
      # RIEN ne force jamais un repull d'image sur tag flottant, contrairement a ECS ci-dessus.
      # Consequence verifiee : apres deux deploiements "Success" completant sans erreur, la console
      # Kudu de app-arkcloud-api-dev echouait toujours avec SSH CONN CLOSE immediat -- le conteneur
      # tournait encore l'ancienne image (sans sshd), parce que le tag ":dev" n'avait pas change
      # aux yeux de Terraform et `terraform apply` etait un no-op sur azurerm_linux_web_app.this.
      # `az webapp restart` force App Service a re-pull l'image derriere le tag flottant au
      # redemarrage -- meme role que force-new-deployment pour ECS juste au-dessus.
      - name: Azure login (CLI restart, separe du provider Terraform azurerm)
        if: >-
          (github.event.client_payload.app == 'api' || github.event.client_payload.app == 'web')
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Force Azure App Service to pull the latest image
        if: >-
          (github.event.client_payload.app == 'api' || github.event.client_payload.app == 'web')
        run: |
          az webapp restart \
            --name "app-arkcloud-${{ github.event.client_payload.app }}-${{ github.event.client_payload.environment }}" \
            --resource-group "rg-arkcloud-${{ github.event.client_payload.environment }}"
