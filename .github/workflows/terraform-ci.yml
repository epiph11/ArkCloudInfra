name: Terraform CI

# Authentification Azure par OIDC (pas de secret client stocké) — nécessite un one-shot de
# configuration manuelle côté Azure. Voir README.md §6 pour les commandes exactes.

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"

permissions:
  id-token: write   # nécessaire pour qu'Azure AD délivre un jeton OIDC à ce run
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true
  TF_VAR_image_org: ${{ vars.IMAGE_ORG }}
  TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
  TF_VAR_aws_postgres_admin_password: ${{ secrets.AWS_POSTGRES_ADMIN_PASSWORD }}
  TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}

jobs:
  validate:
    name: Lint, scan & plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev]  # staging/prod ajoutés une fois dev validé en continu
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      # Sprint 5 — same OIDC pattern as Azure just above: no static AWS access key stored,
      # this action exchanges the job's GitHub OIDC token for temporary credentials by
      # assuming arkcloudinfra-ci (trust policy scoped to this repo, see README §11). The
      # provider "aws" block in providers.tf has no explicit credentials config — it just
      # picks up the AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY/SESSION_TOKEN env vars this step sets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # modules/aws/secret-rotation référence son package Lambda via filebase64sha256(), donc le
      # zip doit exister AVANT le plan — sinon Terraform échoue à l'évaluation, avant même de
      # contacter le moindre fournisseur. Le zip est gitignoré à dessein (wheels binaires
      # psycopg2, plusieurs Mo, reproductibles en une commande), il doit donc être reconstruit
      # ici. Voir modules/aws/secret-rotation/lambda/README.md pour l'équivalent local.
      #
      # Contraintes de plateforme reprises telles quelles : sans --platform/--python-version, pip
      # produirait une wheel pour le runner et non pour le runtime Lambda, avec une erreur
      # d'import qui n'apparaîtrait qu'à la première rotation réelle.
      - name: Build du package Lambda de rotation
        # Chemin absolu via $GITHUB_WORKSPACE : les deux jobs définissent un working-directory
        # par défaut (environments/<env>), donc un chemin relatif à la racine du dépôt serait
        # résolu depuis là et introuvable.
        run: bash "$GITHUB_WORKSPACE/modules/aws/secret-rotation/lambda/build.sh"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1

      - name: tflint
        # GITHUB_TOKEN authenticates tflint's plugin-install requests to api.github.com —
        # unauthenticated requests share a 60/hour rate limit across every job on the runner's
        # IP, which is easy to hit on a day with many CI runs (real cause of the intermittent
        # "Failed to download checksums.txt: ... 500" seen twice in a row on this exact step).
        # Authenticated requests get 5000/hour. Uses the token GitHub Actions already injects
        # for free — no new secret to create.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config="${{ github.workspace }}/.tflint.hcl"
          tflint --config="${{ github.workspace }}/.tflint.hcl" --recursive

      # Scanne le code Terraform lui-même (pas l'infra déployée) : Storage Account public,
      # PostgreSQL sans SSL forcé, Key Vault sans purge protection, NSG trop permissif, etc.
      # skip_check entries below are each a deliberate call, not blanket suppression — see
      # ArkCloudInfra/README.md §9 for the full reasoning behind every one.
      #   - CKV_AZURE_225/212/211/CKV_AZURE_136: zone redundancy / min instances / "production"
      #     SKU / geo-redundant Postgres backup all require upgrading off the dev tier
      #     (B1 App Service, Burstable Postgres) — a real cost jump with no benefit on a
      #     disposable dev environment. Revisit when environments/staging or /prod exist.
      #   - CKV_AZURE_189/109/CKV2_AZURE_32/CKV2_AZURE_57: Key Vault + Postgres private
      #     endpoints — snet-private-endpoint is reserved for exactly this, deliberately empty
      #     until Sprint 6 hardening.
      #   - CKV_AZURE_222: disabling App Service public network access needs a public entry
      #     point in front (Application Gateway / Front Door) — real new infra, Sprint 6+ scope,
      #     not a flag flip.
      #   - CKV_AZURE_13: Azure's built-in Easy Auth would run alongside ArkCloud.API's own JWT
      #     auth — two overlapping auth layers, not a gap to close.
      #   - CKV_AZURE_88: Azure Files is for apps needing persistent local file storage: this
      #     app is stateless, everything durable lives in PostgreSQL.
      #
      # AWS findings (Sprint 5, first Checkov run against modules/aws/*) — same standard, same
      # README §9 style, added there once this batch is confirmed green:
      #   - CKV_AWS_260: sg-alb allows inbound 80/443 from 0.0.0.0/0 by design — it's the public
      #     entry point behind which everything else sits; port 80 exists only to redirect to
      #     443 at the ALB listener, never served directly.
      #   - CKV_AWS_382: sg-ecs-api/sg-ecs-web egress is fully open (needed for RDS, Secrets
      #     Manager, ECR/GHCR pulls, CloudWatch, all reached through the NAT Gateway) — same
      #     posture as Azure's snet-api, which has no egress restriction either. Narrowing to
      #     exact ports/destinations is real Sprint 6 hardening work, not a flag flip.
      #   - CKV2_AWS_5: none of the four security groups are attached to anything YET — this
      #     step only creates the network, ECS/ALB/RDS (which will actually use these SGs)
      #     land in later Sprint 5 steps. Expected to self-resolve once those modules exist;
      #     re-check once module.aws_ecs / module.aws_alb / module.aws_rds are wired in.
      #   - CKV2_AWS_11: VPC flow logs need a destination (CloudWatch Logs group or S3) that
      #     doesn't exist yet — same category as the Azure NSG flow logs deferred to Sprint 6
      #     hardening alongside private endpoints.
      #
      # RDS (Sprint 5, Step 12, modules/aws/rds) — same dev-tier reasoning as the Azure
      # PostgreSQL skips above (CKV_AZURE_136/212 etc.). Confirmed one at a time against real
      # Checkov output (no local Checkov in this sandbox to run the whole set upfront) —
      # IDs/meanings below are what the tool actually reported, not guesses:
      #   - CKV_AWS_157: Multi-AZ — single-AZ is the deliberate dev-cost call, same as the
      #     single NAT Gateway in modules/aws/vpc. Override multi_az for staging/prod.
      #   - CKV_AWS_353: Performance Insights — db.t3.micro doesn't meaningfully support it
      #     (too little memory to be useful); revisit with a larger instance class.
      #   - CKV_AWS_118: Enhanced Monitoring (monitoring_interval + IAM role, per-second OS
      #     metrics) — extra cost/infra for a dev instance nobody is paging on. Distinct from
      #     CKV_AWS_353 above, not a duplicate — Checkov's own output confirmed both are real,
      #     separate checks. CloudWatch Logs exports (postgresql/upgrade) are already enabled;
      #     this is the deeper metric stream, deferred to Step 15 alongside AWS monitoring.
      #   - CKV_AWS_293: deletion protection — off on purpose so `terraform destroy` can tear
      #     dev down cleanly; on for staging/prod.
      #   - CKV_AWS_354: kept as a defensive skip but never actually confirmed against a real
      #     run (every run so far failed on one check at a time — 30, then 353, then 118 — and
      #     354 has yet to come up on its own). Since 118 turned out to be Enhanced Monitoring,
      #     354 is NOT that; its real meaning is still unverified. Leave it until either it
      #     shows up as an actual failure (then confirm+document properly) or a later cleanup
      #     pass removes it as unused.
      #
      # NOT skipped — fixed instead: CKV2_AWS_30 (Postgres query logging) was the first real
      # finding here, resolved by adding log_statement=ddl + log_min_duration_statement=1000
      # to the parameter group rather than suppressing it (see modules/aws/rds/main.tf).
      #
      # Secrets Manager (Sprint 5, Step 13, modules/aws/secrets) — codes below are unconfirmed
      # guesses (same caveat as everywhere else: no local Checkov to test against first):
      #   - CKV_AWS_149: KMS CMK encryption — using the default AWS-managed aws/secretsmanager
      #     key rather than a dedicated CMK, same "managed key is enough for dev" call already
      #     made for RDS storage_encrypted in modules/aws/rds. A CMK adds key management
      #     overhead with no real benefit until there's an actual key-rotation/access-boundary
      #     requirement driving it.
      #   - CKV2_AWS_57: automatic rotation — these are empty containers with no
      #     value/application wired to them yet (see modules/aws/secrets/main.tf's comment),
      #     and this project's rotation policy is documented as manual-only (README §10) for
      #     every secret on both clouds. Building a rotation Lambda for a secret nothing reads
      #     yet is real Sprint 6+ hardening work, not a flag flip.
      #
      # ECR / ALB / ECS (Sprint 5, Step 11, modules/aws/ecr+alb+ecs+ecs-service) — all 11 codes
      # below are confirmed directly from a real Checkov run (no guessing this time):
      #   - CKV_AWS_150: ALB deletion protection off — same "destroy cleanly" dev-tier call as
      #     RDS's deletion_protection and the ECR repos' force_delete.
      #   - CKV_AWS_91: ALB access logging — needs an S3 bucket + delivery policy, real infra
      #     not a flag flip. Deferred to Step 15 (Monitoring AWS), where the actual logging
      #     destinations get built rather than bolted onto the ALB module in isolation.
      #   - CKV_AWS_2, CKV2_AWS_20, CKV_AWS_103: fixed (Sprint 6, modules/aws/alb) — HTTPS
      #     listener + HTTP->HTTPS redirect + TLS 1.2 minimum policy, using a self-signed
      #     certificate (tls_private_key/tls_self_signed_cert, imported into ACM) since no real
      #     domain exists yet for a trusted DNS-validated one — see that module's header comment
      #     for the full tradeoff (browsers will show a cert warning; acceptable for dev-only
      #     traffic). ArkCloud.Blazor's HttpClients were updated to trust that one specific host
      #     (Api__TrustSelfSignedCert, see ArkCloud/frontend/ArkCloud.Blazor/Program.cs) since
      #     the default TLS validation would otherwise reject every server-to-server API call.
      #   - CKV_AWS_378: target group protocol is still HTTP — this is TLS offloading at the ALB
      #     (terminate HTTPS at the listener, plain HTTP to the Fargate targets over the private
      #     VPC network), the standard and secure pattern for this architecture, not a gap;
      #     Checkov has a known false-positive report for exactly this case
      #     (bridgecrewio/checkov#6754). Re-encrypting ALB-to-target would need TLS certs
      #     terminated inside each container — disproportionate for traffic that never leaves
      #     the VPC.
      #   - CKV_AWS_136, CKV_AWS_158: ECR / CloudWatch Log Group KMS CMK — default AWS-managed
      #     key, same "managed key is enough for dev" call already made for RDS storage
      #     encryption and the Secrets Manager containers (CKV_AWS_149 above).
      #   - CKV_AWS_51: ECR tag mutability — deliberately MUTABLE, matches the existing floating
      #     "dev" tag re-push pattern already used identically on the Azure App Service side.
      #   - CKV_AWS_338: CloudWatch log retention >= 365 days — 30 days is enough for dev.
      #   - CKV2_AWS_28: ALB not behind a WAF — real cost/infra, Sprint 6 hardening candidate,
      #     same category as the other deferred hardening items (private endpoints, flow logs).
      #
      # CloudTrail / monitoring (Sprint 5, Step 15, modules/aws/cloudtrail+monitoring) — 10
      # findings confirmed from a real Checkov run; 4 fixed outright (versioning, lifecycle
      # expiration, SNS delivery notifications, CloudWatch Logs integration — see
      # modules/aws/cloudtrail/main.tf), 6 skipped below:
      #   - CKV_AWS_35, CKV_AWS_145: CloudTrail/S3 encrypted with the default AWS-managed key
      #     (SSE-S3) rather than a customer-managed KMS CMK — same "managed key is enough for
      #     dev" call already made for RDS, Secrets Manager, ECR, and CloudWatch Logs elsewhere
      #     in this project.
      #   - CKV_AWS_67: single-region trail (is_multi_region_trail = false) — this is a
      #     single-region (eu-west-1) dev deployment (see modules/aws/vpc), so a multi-region
      #     trail would only duplicate delivery cost with nothing extra to actually audit.
      #   - CKV2_AWS_62: S3 event notifications (aws_s3_bucket_notification) on the trail bucket
      #     itself — redundant with the CloudTrail-native SNS delivery notification already
      #     added for CKV_AWS_252 (fixed, not skipped), which already signals "a new log object
      #     arrived" without a second, S3-native notification mechanism layered on top.
      #   - CKV_AWS_144: cross-region replication for the trail bucket — dev-tier single-region
      #     deployment, same reasoning as CKV_AWS_67 above.
      #   - CKV_AWS_18: S3 access logging (who read/wrote this bucket) — this bucket is already
      #     an audit log; recursively logging access to it is real compliance-tier hardening
      #     with no driving requirement yet, same "no compliance mandate yet" posture as the
      #     rest of this project's dev-tier skips.
      #
      # Cost-guard (Sprint 5, modules/azure/cost-guard) — 4 findings from a real Checkov run; 3
      # fixed outright (CloudTrail S3 abort-incomplete-multipart-upload, both SNS topics'
      # AWS-managed-key encryption — see modules/aws/cloudtrail/main.tf and
      # modules/aws/monitoring/main.tf), 1 skipped below:
      #   - CKV2_AZURE_24: Automation Account allows public network access — the cost-guard
      #     runbook is triggered by an Azure Monitor Action Group calling the Automation
      #     Account's webhook over its public HTTPS endpoint; disabling public network access
      #     would require Automation Account Private Link (private endpoint + private DNS zone)
      #     to keep that reachable, which is disproportionate infrastructure for a dev-tier
      #     cost-saving automation. Same category as the other deferred network-hardening items
      #     (Private Endpoints, NSG flow logs) — Sprint 6 candidate, not fixed here.
      #
      # Flow logs (Sprint 6, modules/azure/flow-logs) — 10 findings from a real Checkov run; 2
      # fixed outright (soft delete, 90-day retention — see modules/azure/flow-logs/main.tf and
      # variables.tf), 8 skipped below (full reasoning also in that module's header comment and
      # README.md §9):
      #   - CKV2_AZURE_41: SAS expiration policy — a correct `sas_policy` block (matching Prisma
      #     Cloud's own remediation guide verbatim) is present in main.tf and still fails. This is
      #     a confirmed Checkov bug, not a config gap — see
      #     https://github.com/bridgecrewio/checkov/issues/6140, someone else hit the exact same
      #     false positive with identical HCL. Re-check without this skip if a future Checkov
      #     upgrade fixes it.
      #   - CKV_AZURE_59 / CKV2_AZURE_33: storage account public network access / no private
      #     endpoint — same Private Link tradeoff as CKV2_AZURE_24 above, disproportionate at
      #     dev scale for a diagnostics-only bucket.
      #   - CKV2_AZURE_40: Shared Key auth not disabled — Network Watcher's only AAD-only path is
      #     a user-assigned managed identity, which azurerm_network_watcher_flow_log doesn't
      #     support in the current provider (open request, terraform-provider-azurerm#30219);
      #     disabling this would silently stop flow log delivery.
      #   - CKV2_AZURE_1: no Customer Managed Key — flow logs are network metadata (source/dest
      #     IP, port, allow/deny), not the kind of "critical data" this check is aimed at;
      #     CMK here would mean a new Key Vault key + RBAC + identity wiring for no real gain.
      #   - CKV_AZURE_206: replication is LRS not ZRS/GRS — deliberate, same reasoning as the
      #     retention default (module main.tf comment): write-once forensic JSON, not
      #     business-continuity data.
      #   - CKV_AZURE_33: Storage Analytics logging for the Queue service — this account only
      #     ever receives blobs, the Queue service isn't used at all.
      #   - CKV_AZURE_43: storage account naming rules — false positive. Checkov can't statically
      #     resolve the `replace()` call building the name across the module boundary; the real
      #     applied name (`starkclouddevflow`, confirmed in `terraform apply` output) is 17
      #     lowercase alphanumeric characters and already satisfies the rule.
      # Rotation Lambda (Sprint 6, modules/aws/secret-rotation) — 5 findings from a real Checkov
      # run; 1 fixed outright (X-Ray tracing), 4 skipped below:
      #   - CKV_AWS_115: no function-level concurrency limit. Attempted and rejected by AWS at
      #     apply time, not a preference: "Specified ReservedConcurrentExecutions for function
      #     decreases account's UnreservedConcurrentExecution below its minimum value of [10]".
      #     This account sits at the default Lambda concurrency quota, so any reservation drops
      #     the unreserved pool below AWS's own floor. Revisit after a quota increase.
      #   - CKV_AWS_116: no Lambda DLQ. Secrets Manager does invoke rotation functions
      #     asynchronously (verified against AWS docs, not assumed), so a DLQ is technically
      #     applicable — but it would only accumulate event payloads nobody reads. The actual
      #     requirement is *knowing* a rotation failed, which is a CloudWatch alarm on the
      #     function's Errors metric wired to the existing alerts topic. Built instead of the
      #     DLQ, see aws_cloudwatch_metric_alarm.rotation_errors in that module.
      #   - CKV_AWS_173: Lambda env vars not encrypted with a customer-managed KMS key. They're
      #     already encrypted at rest with an AWS-managed key, and none of these variables are
      #     secret in the first place (DB host/name/username, ECS cluster and service names —
      #     the password only ever exists inside Secrets Manager and the function's memory).
      #     Same "AWS-managed key is enough for dev" call as CKV_AWS_136/158/149 above.
      #   - CKV_AWS_272: no code-signing validation. Requires an AWS Signer signing profile and
      #     configuration — real supply-chain infrastructure, and meaningful only once the
      #     package is built by a trusted pipeline rather than by the documented local build
      #     command (modules/aws/secret-rotation/lambda/README.md). Revisit if Lambda packaging
      #     moves into CI.
      #   - CKV_AWS_304 (rotation Secrets Manager sous 90 jours) : faux positif de résolution de
      #     variable, diagnostic établi en lisant le code source du check et non supposé. Sa
      #     condition est `days <= 90`, donc notre valeur de 90 passerait — mais elle est fournie
      #     via var.rotation_interval_days, que Checkov ne résout pas à travers la frontière de
      #     module ; force_int() renvoie alors None et le check retombe sur son cas d'échec.
      #     Même classe que CKV_AZURE_43 plus haut.
      #     Le check soulevait néanmoins un point réel — 90 n'était qu'un défaut modifiable — donc
      #     plutôt que de seulement l'écarter, la contrainte est désormais RÉELLEMENT appliquée par
      #     un bloc validation sur la variable, des deux côtés (modules/aws/secret-rotation et
      #     modules/azure/secret-rotation) : tout intervalle > 90 jours fait échouer le plan.
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: environments/${{ matrix.environment }}
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: >-
            CKV_AZURE_225,CKV_AZURE_212,CKV_AZURE_211,CKV_AZURE_136,
            CKV_AZURE_189,CKV_AZURE_109,CKV2_AZURE_32,CKV2_AZURE_57,
            CKV_AZURE_222,CKV_AZURE_13,CKV_AZURE_88,
            CKV_AWS_260,CKV_AWS_382,CKV2_AWS_5,CKV2_AWS_11,
            CKV_AWS_157,CKV_AWS_353,CKV_AWS_118,CKV_AWS_293,CKV_AWS_354,
            CKV_AWS_149,CKV2_AWS_57,
            CKV_AWS_150,CKV_AWS_91,
            CKV_AWS_378,CKV_AWS_136,CKV_AWS_158,CKV_AWS_51,CKV_AWS_338,
            CKV2_AWS_28,
            CKV_AWS_35,CKV_AWS_145,CKV_AWS_67,CKV2_AWS_62,CKV_AWS_144,CKV_AWS_18,
            CKV2_AZURE_24,
            CKV_AZURE_59,CKV_AZURE_43,CKV_AZURE_206,CKV_AZURE_33,
            CKV2_AZURE_1,CKV2_AZURE_33,CKV2_AZURE_40,CKV2_AZURE_41,
            CKV_AWS_115,CKV_AWS_116,CKV_AWS_173,CKV_AWS_272,CKV_AWS_304

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -out=tfplan -input=false

      # Visible directement dans l'onglet "Summary" du run, sans action tierce ni permission
      # supplémentaire — suffisant pour relire un plan avant merge.
      - name: Publier le plan dans le résumé du run
        if: always()
        run: |
          echo '## Terraform plan — ${{ matrix.environment }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Ne tourne que sur push vers main (jamais sur une PR), après validate. Gated par
  # l'Environment GitHub "production" — ajouter des reviewers requis dans Settings >
  # Environments donne l'approbation manuelle avant tout apply réel, sans toucher au workflow.
  apply:
    name: Apply
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Même build que dans le job validate, et pour la même raison : le zip est gitignoré, donc
      # absent d'un checkout frais. Sans lui, l'apply échoue à l'évaluation de filebase64sha256()
      # avant de toucher quoi que ce soit — donc sans dégât, mais sans déploiement non plus.
      - name: Build du package Lambda de rotation
        # Chemin absolu via $GITHUB_WORKSPACE : les deux jobs définissent un working-directory
        # par défaut (environments/<env>), donc un chemin relatif à la racine du dépôt serait
        # résolu depuis là et introuvable.
        run: bash "$GITHUB_WORKSPACE/modules/aws/secret-rotation/lambda/build.sh"

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -auto-approve -input=false
